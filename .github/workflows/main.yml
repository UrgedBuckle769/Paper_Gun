name: Manual Build & Save

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (dev/prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'

jobs:
  build-and-save:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 模拟构建过程 (这里创建一个 dist 文件夹和一些文件)
      - name: Run Build
        run: |
          echo "🚀 Starting build for ${{ github.event.inputs.build_type }}..."
          mkdir -p dist
          echo "Build Time: $(date)" > dist/build-info.txt
          echo "Environment: ${{ github.event.inputs.build_type }}" >> dist/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist/build-info.txt
          
          # 模拟生成一个二进制文件或压缩包
          echo "This is a dummy binary file" > dist/app-${{ github.event.inputs.build_type }}.bin
          
          ls -R dist

      # 3. 【方案 A】上传为 Artifact (推荐用于临时下载)
      # 运行完后，你可以在 GitHub Action 页面点击 "Summary" 找到下载链接
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.event.inputs.build_type }}
          path: dist/
          retention-days: 5 # 保留5天

      # 4. 【方案 B】推送到仓库 (如果需要文件永久留在仓库里)
      # 注意：这需要配置权限，且会触发新的提交
      - name: Commit and Push if Prod
        if: github.event.inputs.build_type == 'prod'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/
          # 只有当有变动时才提交
          if ! git diff --staged --quiet; then
            git commit -m "chore: build artifacts for ${{ github.event.inputs.build_type }} [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
