name: PaperGun
version: '${project.version}'
main: com.papergun.PaperGunPlugin
api-version: '1.20'
description: A gun plugin for PurPur/Paper servers
authors:
  - ABYDOS-Server-Team
  - Shiroko0516L
  
depend: [ProtocolLib]

commands:
  papergun:
    description: Main command for PaperGun
    usage: /papergun <setweapon|setceweapon|listguns|delgun> ...
    permission: papergun.admin

permissions:
  papergun.admin:
    description: Admin permission for PaperGun
    default: op
